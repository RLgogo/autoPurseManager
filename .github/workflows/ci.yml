name: Android CI

on:
  push:
    branches:
      - main
      - feature/test
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build with'
        required: false
        default: '6.12.0'
      release_tag:
        description: 'Publish the APKs to this release tag (e.g. v1.0.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: ${{ inputs.qt_version || '6.12.0' }}
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false'

jobs:
  build-apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real devices.
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          # Emulators and x86_64 Android devices.
          - abi: x86_64
            qt_arch: android_x86_64

    env:
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Qt 6.12 for Android requires JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform, build-tools and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --licenses > /dev/null || true
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # Cross-compiling needs a host Qt of the same version as the Android Qt.
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Remember host Qt
        run: echo "QT_HOST_DIR=${QT_ROOT_DIR}" >> "$GITHUB_ENV"

      - name: Install Android Qt (${{ matrix.abi }})
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.abi }}-

      - name: Show toolchain versions
        run: |
          echo "ABI       : ${ABI}"
          echo "Android Qt: ${QT_ROOT_DIR}"
          echo "Host Qt   : ${QT_HOST_DIR}"
          java -version
          cmake --version | head -n 1
          ninja --version

      - name: Configure
        env:
          QT_HOST_PATH: ${{ env.QT_HOST_DIR }}
        run: |
          "${QT_ROOT_DIR}/bin/qt-cmake" -S . -B "build-android-${ABI}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_HOST_PATH="${QT_HOST_DIR}" \
            -DANDROID_SDK_ROOT="${ANDROID_HOME}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}"

      - name: Build APK
        run: cmake --build "build-android-${ABI}" --target apk --parallel

      - name: Collect and verify APK
        run: |
          mkdir -p dist
          APK=$(find "build-android-${ABI}/android-build/build/outputs/apk" -name '*.apk' -print -quit)
          test -n "${APK}"
          cp "${APK}" "dist/autoPurseManager-1.0.0-${ABI}.apk"
          AAPT2="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          echo "::group::aapt2 badging"
          "${AAPT2}" dump badging "dist/autoPurseManager-1.0.0-${ABI}.apk" | head -n 25
          echo "::endgroup::"
          echo "::group::native libraries"
          unzip -l "dist/autoPurseManager-1.0.0-${ABI}.apk" | grep -E 'lib/[^/]+/[^/]+\.so' | head -n 15 || true
          echo "::endgroup::"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: autoPurseManager-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  # Attach the built APKs to a GitHub Release.
  # Triggered by pushing a "v*" tag, or manually with a release_tag input.
  publish-release:
    name: Publish release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: autoPurseManager-*
          path: dist
          merge-multiple: true

      - name: List APKs
        run: ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
