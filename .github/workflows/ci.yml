name: build andrio

on:
    push:
        branches:
            - feature/test
        
    

jobs:
    build_andrio:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
              name: clone repo

            - name: download qt
              uses: jurplel/install-qt-action@v4
              with:
                version: ' 6.7.0'
                cache: true
                host: 'all_os'
                target: 'android'
                arch: 'android_armv7'

            - name: env test
              run: |
                qt --version
                make --version
